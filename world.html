main{max-width:1050px;margin:auto;padding:2rem 1rem 4rem}h1{font-size:clamp(2rem,5vw,3.4rem);color:#204738}

</style></head><body><header class="site-header"><a class="brand" href="index.html">✧ Of Kings, Curses and Mist</a><div class="header-actions"><label for="language" class="sr-only">Language / Idioma</label><select id="language"><option value="en">English</option><option value="es">Español</option></select></div></header>

<p class="source" id="source"></p></main><footer class="site-footer">Created and curated by David Martín Guerrero · Original bilingual literary retellings with AI assistance.</footer>
<script>
const entries={"en":[{"id":"tuatha","group":"Peoples and beings","name":"Tuatha Dé Danann","desc":"A supernatural people in Irish legend associated with magical arts, craftsmanship and the struggles over Ireland. The Dagda, Lugh and Ogma belong to their stories; Lir is also associated with their world.","chapters":"Chapters I, III"},{"id":"fomorians","group":"Peoples and beings","name":"Fomorians","desc":"Powerful, often formidable rivals of the Tuatha Dé Danann in early Irish myth. Their appearance and relationships vary across versions.","chapters":"Chapter III"},{"id":"fianna","group":"Peoples and beings","name":"Fianna","desc":"Bands of warriors and hunters whose adventures form an important part of the Fenian Cycle. Fionn mac Cumhaill becomes their celebrated leader.","chapters":"Chapter II"},{"id":"lir","group":"Characters","name":"Lir","desc":"Father of Fionnuala, Aodh, Fiachra and Conn. In this retelling, his love for his children endures after Aoife transforms them into swans.","chapters":"Chapter I"},{"id":"aobh","group":"Characters","name":"Aobh","desc":"Lir’s first wife and the mother of his four children. She dies before the enchantment begins.","chapters":"Chapter I"},{"id":"aoife","group":"Characters","name":"Aoife","desc":"Aobh’s sister and Lir’s second wife. In the legend her jealousy leads her to enchant the children and condemn them to many years as swans.","chapters":"Chapter I"},{"id":"fionnuala","group":"Characters","name":"Fionnuala","desc":"The eldest of Lir’s four children. As a swan, she cares for her three brothers throughout their long exile.","chapters":"Chapter I"},{"id":"aodh","group":"Characters","name":"Aodh","desc":"One of Lir’s sons and Fionnuala’s younger brother. He shares the long enchantment with Fiachra and Conn.","chapters":"Chapter I"},{"id":"fiachra","group":"Characters","name":"Fiachra","desc":"One of Lir’s sons. He and his siblings survive their enchanted years through loyalty to one another.","chapters":"Chapter I"},{"id":"conn","group":"Characters","name":"Conn","desc":"The youngest of Lir’s children, transformed with his siblings and protected by Fionnuala.","chapters":"Chapter I"},{"id":"bodb","group":"Characters","name":"Bodb Dearg","desc":"A prominent king of the Tuatha Dé Danann in versions of the story of Lir’s children. Names and relationships differ in retellings.","chapters":"Chapter I"},{"id":"lairgnen","group":"Characters","name":"Lairgnen","desc":"A figure associated with the fulfilment of the prophecy ending the children’s enchantment. The details vary among traditional versions.","chapters":"Chapter I"},{"id":"deoch","group":"Characters","name":"Deoch","desc":"A woman whose desire to obtain the swans becomes part of the final events in versions of the Children of Lir story.","chapters":"Chapter I"},{"id":"fionn","group":"Characters","name":"Fionn mac Cumhaill","desc":"A major hero of the Fenian Cycle. The story of the Salmon of Knowledge describes a formative moment in his youth. He is also called Finn and, in some early-life traditions, Demne.","chapters":"Chapter II"},{"id":"finegas","group":"Characters","name":"Finegas (Finn Éces)","desc":"The poet and teacher who waits for the Salmon of Knowledge. His names vary in written traditions; his role links poetry with learning and memory.","chapters":"Chapter II"},{"id":"dagda","group":"Characters","name":"The Dagda","desc":"A powerful figure of the Tuatha Dé Danann associated with abundance, strength, magic and an extraordinary harp.","chapters":"Chapter III"},{"id":"lugh","group":"Characters","name":"Lugh","desc":"A champion among the Tuatha Dé Danann, celebrated for his many skills; he helps retrieve the Dagda’s harp.","chapters":"Chapter III"},{"id":"ogma","group":"Characters","name":"Ogma","desc":"A great warrior among the Tuatha Dé Danann who accompanies the Dagda and Lugh.","chapters":"Chapter III"},{"id":"uaithne","group":"Characters","name":"Úaithne","desc":"The Dagda’s harper, taken by the Fomorians in the medieval account. In that source the harp itself bears different names.","chapters":"Chapter III"},{"id":"bres","group":"Characters","name":"Bres","desc":"A figure present at the Fomorian feast, described as the son of Elatha in the medieval account of the Dagda’s harp.","chapters":"Chapter III"},{"id":"elatha","group":"Characters","name":"Elatha","desc":"The father of Bres in the medieval episode about the Dagda’s harp.","chapters":"Chapter III"},{"id":"derravaragh","group":"Places","name":"Lough Derravaragh","desc":"A real lake in County Westmeath. In the legend, Lir’s children spend their first three hundred years as swans here.","chapters":"Chapter I"},{"id":"moyle","group":"Places","name":"Sea of Moyle","desc":"The waters between northeastern Ireland and Scotland. The swans’ second period of exile takes place amid its dangerous storms.","chapters":"Chapter I"},{"id":"erris","group":"Places","name":"Erris","desc":"A coastal region in County Mayo associated with the swans’ final years of wandering.","chapters":"Chapter I"},{"id":"inis","group":"Places","name":"Inis Gluaire","desc":"An island off the Mayo coast associated with the conclusion of the Children of Lir legend; also known as Inishglora.","chapters":"Chapter I"},{"id":"boyne","group":"Places","name":"River Boyne","desc":"A real river in eastern Ireland. Its legendary associations include wisdom, poetry and the Salmon of Knowledge.","chapters":"Chapter II"},{"id":"magt","group":"Places","name":"Mag Tuired","desc":"A legendary battleground associated with conflict between the Tuatha Dé Danann and the Fomorians.","chapters":"Chapter III"},{"id":"salmon","group":"Magical objects and motifs","name":"Salmon of Knowledge","desc":"A legendary salmon whose consumption bestows special knowledge on Fionn. Some associated traditions link its wisdom to hazelnuts falling into enchanted waters.","chapters":"Chapter II"},{"id":"harp","group":"Magical objects and motifs","name":"The Dagda’s Harp","desc":"The magical harp whose music brings sorrow, joy and sleep. In Cath Maige Tuired its names are Daur Dá Bláo and Cóir Cetharchair.","chapters":"Chapter III"},{"id":"cian","group":"Characters","name":"Cian","desc":"Father of Lugh. In the tale of Tuireann's sons, he tries to escape his enemies by changing into a pig, but Brian and his brothers kill him.","chapters":"Chapter IV"},{"id":"tuireann","group":"Characters","name":"Tuireann","desc":"Father of Brian, Iuchar and Iucharba. The brothers' perilous quest is demanded as compensation for the death of Cian.","chapters":"Chapter IV"},{"id":"brian","group":"Characters","name":"Brian","desc":"Eldest of Tuireann's three sons. A daring and resourceful leader whose killing of Cian sets the brothers' fatal quest in motion.","chapters":"Chapter IV"},{"id":"iuchar","group":"Characters","name":"Iuchar","desc":"One of the three sons of Tuireann, travelling with Brian and Iucharba to fulfil Lugh's demands.","chapters":"Chapter IV"},{"id":"iucharba","group":"Characters","name":"Iucharba","desc":"Youngest of Tuireann's three sons, sharing the difficult search for magical treasures.","chapters":"Chapter IV"},{"id":"easal","group":"Characters","name":"Easal","desc":"King of the Golden Pillars and keeper of seven magical pigs. In the traditional tale he gives them up and tries to negotiate with another ruler.","chapters":"Chapter IV"},{"id":"miodhchaoin","group":"Characters","name":"Miodhchaoin","desc":"Guardian of the hill where the brothers must give three cries; he and his sons fight them.","chapters":"Chapter IV"},{"id":"eraic","group":"Magical objects and motifs","name":"Éraic (blood-fine)","desc":"Compensation demanded after a killing in Irish tradition. Lugh's blood-fine is deliberately difficult to fulfil.","chapters":"Chapter IV"},{"id":"wave-sweeper","group":"Magical objects and motifs","name":"The Wave-Sweeper","desc":"A magical boat belonging to Manannán, lent by Lugh to the brothers to carry them across the sea.","chapters":"Chapter IV"},{"id":"muirthemne","group":"Places","name":"Plain of Muirthemne","desc":"A legendary landscape associated with the encounter between Cian and the sons of Tuireann; linked with the area around Dundalk.","chapters":"Chapter IV"}],"es":[{"id":"tuatha","group":"Pueblos y seres","name":"Tuatha Dé Danann","desc":"Pueblo sobrenatural de la mitología irlandesa, asociado a la magia, las artes y la disputa por Irlanda. Entre sus figuras destacan el Dagda, Lugh y Ogma; Lir también pertenece a ese universo.","chapters":"Capítulos I y III"},{"id":"fomorians","group":"Pueblos y seres","name":"Fomorianos","desc":"Poderosos adversarios de los Tuatha Dé Danann en los antiguos mitos irlandeses. Su aspecto y sus relaciones varían según las versiones.","chapters":"Capítulo III"},{"id":"fianna","group":"Pueblos y seres","name":"Fianna","desc":"Grupos de guerreros y cazadores cuyas hazañas forman parte del ciclo feniano. Fionn mac Cumhaill llega a ser su célebre jefe.","chapters":"Capítulo II"},{"id":"lir","group":"Personajes","name":"Lir","desc":"Padre de Fionnuala, Aodh, Fiachra y Conn. En esta adaptación, su amor por los hijos perdura incluso después de que Aoife los transforme en cisnes.","chapters":"Capítulo I"},{"id":"aobh","group":"Personajes","name":"Aobh","desc":"Primera esposa de Lir y madre de sus cuatro hijos. Muere antes de que comience el encantamiento.","chapters":"Capítulo I"},{"id":"aoife","group":"Personajes","name":"Aoife","desc":"Hermana de Aobh y segunda esposa de Lir. Sus celos la llevan a hechizar a los niños y condenarlos a vivir durante siglos como cisnes.","chapters":"Capítulo I"},{"id":"fionnuala","group":"Personajes","name":"Fionnuala","desc":"La mayor de los cuatro hijos de Lir. Convertida en cisne, cuida de sus tres hermanos durante su largo destierro.","chapters":"Capítulo I"},{"id":"aodh","group":"Personajes","name":"Aodh","desc":"Uno de los hijos de Lir y hermano menor de Fionnuala. Comparte el encantamiento con Fiachra y Conn.","chapters":"Capítulo I"},{"id":"fiachra","group":"Personajes","name":"Fiachra","desc":"Uno de los hijos de Lir. Él y sus hermanos sobreviven a los siglos de hechizo gracias a su unión.","chapters":"Capítulo I"},{"id":"conn","group":"Personajes","name":"Conn","desc":"El menor de los hijos de Lir, transformado en cisne junto a sus hermanos y protegido por Fionnuala.","chapters":"Capítulo I"},{"id":"bodb","group":"Personajes","name":"Bodb Dearg","desc":"Rey destacado de los Tuatha Dé Danann en versiones de la leyenda de los hijos de Lir. Los nombres y parentescos varían entre adaptaciones.","chapters":"Capítulo I"},{"id":"lairgnen","group":"Personajes","name":"Lairgnen","desc":"Personaje relacionado con el cumplimiento de la profecía que pone fin al encantamiento de los niños. Los detalles cambian según la versión.","chapters":"Capítulo I"},{"id":"deoch","group":"Personajes","name":"Deoch","desc":"Mujer cuyo deseo de hacerse con los cisnes interviene en el desenlace de algunas versiones de la leyenda.","chapters":"Capítulo I"},{"id":"fionn","group":"Personajes","name":"Fionn mac Cumhaill","desc":"Gran héroe del ciclo feniano. La historia del salmón cuenta un episodio decisivo de su juventud. También aparece como Finn y, en algunas tradiciones de su infancia, Demne.","chapters":"Capítulo II"},{"id":"finegas","group":"Personajes","name":"Finegas (Finn Éces)","desc":"Poeta y maestro que espera al salmón del conocimiento. Su nombre presenta variantes y su papel relaciona la poesía con el saber y la memoria.","chapters":"Capítulo II"},{"id":"dagda","group":"Personajes","name":"El Dagda","desc":"Poderosa figura de los Tuatha Dé Danann relacionada con la abundancia, la fuerza, la magia y un arpa extraordinaria.","chapters":"Capítulo III"},{"id":"lugh","group":"Personajes","name":"Lugh","desc":"Campeón de los Tuatha Dé Danann, famoso por sus muchas habilidades; ayuda a recuperar el arpa del Dagda.","chapters":"Capítulo III"},{"id":"ogma","group":"Personajes","name":"Ogma","desc":"Gran guerrero de los Tuatha Dé Danann que acompaña al Dagda y a Lugh.","chapters":"Capítulo III"},{"id":"uaithne","group":"Personajes","name":"Úaithne","desc":"Arpista del Dagda, capturado por los fomorianos en el relato medieval. En esa fuente el arpa tiene otros nombres.","chapters":"Capítulo III"},{"id":"bres","group":"Personajes","name":"Bres","desc":"Personaje presente en el banquete de los fomorianos, identificado como hijo de Elatha en la fuente medieval.","chapters":"Capítulo III"},{"id":"elatha","group":"Personajes","name":"Elatha","desc":"Padre de Bres en el episodio medieval sobre el arpa del Dagda.","chapters":"Capítulo III"},{"id":"derravaragh","group":"Lugares","name":"Lago Derravaragh","desc":"Lago real del condado de Westmeath. Según la leyenda, los hijos de Lir pasan allí sus primeros trescientos años convertidos en cisnes.","chapters":"Capítulo I"},{"id":"moyle","group":"Lugares","name":"Mar de Moyle","desc":"Aguas situadas entre el noreste de Irlanda y Escocia. Los cisnes atraviesan aquí el segundo período de su destierro, entre tormentas.","chapters":"Capítulo I"},{"id":"erris","group":"Lugares","name":"Erris","desc":"Región costera del condado de Mayo vinculada con los últimos años del viaje de los cisnes.","chapters":"Capítulo I"},{"id":"inis","group":"Lugares","name":"Inis Gluaire","desc":"Isla de la costa de Mayo asociada al desenlace de la leyenda de los hijos de Lir; también se conoce como Inishglora.","chapters":"Capítulo I"},{"id":"boyne","group":"Lugares","name":"Río Boyne","desc":"Río real del este de Irlanda. En la tradición se vincula a la sabiduría, la poesía y el salmón del conocimiento.","chapters":"Capítulo II"},{"id":"magt","group":"Lugares","name":"Mag Tuired","desc":"Campo de batalla legendario relacionado con el enfrentamiento entre los Tuatha Dé Danann y los fomorianos.","chapters":"Capítulo III"},{"id":"salmon","group":"Objetos y motivos mágicos","name":"Salmón del conocimiento","desc":"Salmón legendario que concede un saber extraordinario a Fionn al probarlo. Algunas tradiciones relacionan su sabiduría con avellanas caídas en aguas encantadas.","chapters":"Capítulo II"},{"id":"harp","group":"Objetos y motivos mágicos","name":"El arpa del Dagda","desc":"Arpa mágica cuya música despierta tristeza, alegría y sueño. En Cath Maige Tuired sus nombres son Daur Dá Bláo y Cóir Cetharchair.","chapters":"Capítulo III"},{"id":"cian","group":"Personajes","name":"Cian","desc":"Padre de Lugh. En la leyenda de los hijos de Tuireann intenta escapar transformándose en cerdo, pero Brian y sus hermanos lo matan.","chapters":"Capítulo IV"},{"id":"tuireann","group":"Personajes","name":"Tuireann","desc":"Padre de Brian, Iuchar e Iucharba. La peligrosa búsqueda de los hermanos es una compensación exigida por la muerte de Cian.","chapters":"Capítulo IV"},{"id":"brian","group":"Personajes","name":"Brian","desc":"Mayor de los hijos de Tuireann. Personaje audaz e ingenioso cuyo asesinato de Cian desencadena el viaje fatal de los hermanos.","chapters":"Capítulo IV"},{"id":"iuchar","group":"Personajes","name":"Iuchar","desc":"Uno de los tres hijos de Tuireann. Acompaña a Brian e Iucharba para cumplir las exigencias de Lugh.","chapters":"Capítulo IV"},{"id":"iucharba","group":"Personajes","name":"Iucharba","desc":"El menor de los tres hijos de Tuireann; comparte la difícil búsqueda de los tesoros mágicos.","chapters":"Capítulo IV"},{"id":"easal","group":"Personajes","name":"Easal","desc":"Rey de las Columnas de Oro y dueño de siete cerdos mágicos. En la tradición los entrega y trata de negociar con otro soberano.","chapters":"Capítulo IV"},{"id":"miodhchaoin","group":"Personajes","name":"Miodhchaoin","desc":"Guardián de la colina donde los hermanos deben gritar tres veces. Él y sus hijos se enfrentan a los viajeros.","chapters":"Capítulo IV"},{"id":"eraic","group":"Objetos y motivos mágicos","name":"Éraic (compensación)","desc":"Compensación exigida por una muerte en la tradición irlandesa. Lugh impone unas condiciones deliberadamente difíciles.","chapters":"Capítulo IV"},{"id":"wave-sweeper","group":"Objetos y motivos mágicos","name":"La Barredora de Olas","desc":"Barca mágica de Manannán que Lugh presta a los hermanos para atravesar el mar.","chapters":"Capítulo IV"},{"id":"muirthemne","group":"Lugares","name":"Llanura de Muirthemne","desc":"Paisaje legendario asociado al encuentro de Cian y los hijos de Tuireann, vinculado a la zona de Dundalk.","chapters":"Capítulo IV"}]};
const copy={
en:{back:'← Library',kicker:'A growing reference',title:'The World Behind the Legends',intro:'Discover the characters, peoples, places and magical objects encountered in the first three legends. Entries provide context, not an interruption to the stories: the traditional sources sometimes differ.',source:'Sources and further reading are listed at the end of the relevant chapter. Principal references include the medieval tales of the Children of Lir, the boyhood exploits of Finn and the Second Battle of Mag Tuired.'},
es:{back:'← Biblioteca',kicker:'Una enciclopedia en construcción',title:'El mundo detrás de las leyendas',intro:'Conoce a los personajes, pueblos, lugares y objetos mágicos que aparecen en las tres primeras leyendas. Estas entradas ayudan a contextualizar los relatos, cuyas fuentes tradicionales presentan a veces diferencias.',source:'Las fuentes y lecturas complementarias figuran al final de cada capítulo. Entre las principales referencias están los relatos medievales de los hijos de Lir, la juventud de Fionn y la Segunda Batalla de Mag Tuired.'}
};
const control=document.getElementById('language');let lang=localStorage.getItem('okcm-language')==='es'?'es':'en';control.value=lang;
function render(){
 const d=copy[lang];document.documentElement.lang=lang;document.title=d.title;
 for(const k of ['back','kicker','title','intro','source'])document.getElementById(k).textContent=d[k];
 const root=document.getElementById('entries');root.replaceChildren();
 const alphabet=document.getElementById('alphabet');alphabet.replaceChildren();alphabet.setAttribute('aria-label',lang==='es'?'Índice alfabético':'Alphabetical index');
 const sortName=name=>name.replace(/^(?:the |el |la |los |las |un |una )/i,'').trim();
 const ordered=[...entries[lang]].sort((a,b)=>sortName(a.name).localeCompare(sortName(b.name),lang,{sensitivity:'base'}));
 let section=null,lastLetter='';
 for(const item of ordered){
  const letter=sortName(item.name).charAt(0).toLocaleUpperCase(lang);
  if(letter!==lastLetter){
   section=document.createElement('section');
   const h=document.createElement('h2');h.className='letter-heading';h.id='letter-'+letter;h.textContent=letter;
   section.append(h);root.append(section);
   const jump=document.createElement('a');jump.href='#letter-'+letter;jump.textContent=letter;alphabet.append(jump);
   lastLetter=letter;
  }
  const article=document.createElement('article');article.className='entry';article.id=item.id;
  const kind=document.createElement('p');kind.className='entry-type';kind.textContent=item.group;
  const name=document.createElement('h3');name.textContent=item.name;
  const detail=document.createElement('p');detail.textContent=item.desc;
  const cite=document.createElement('p');cite.className='small';cite.textContent=item.chapters;
  article.append(kind,name,detail,cite);section.append(article);
 }
 if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}))}
}
control.addEventListener('change',()=>{lang=control.value;localStorage.setItem('okcm-language',lang);render()});
window.addEventListener('hashchange',()=>{const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));target?.scrollIntoView({block:'start'})});
render();
</script></body></html>
